---
name: postgres

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    ports:
      - 5432:5432
    volumes:
      - data:/var/lib/postgresql/data

volumes:
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $PWD/data
