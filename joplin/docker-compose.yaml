---
name: 'note'

services:
  db:
    image: postgres:16
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DATABASE}
  joplin:
    image: joplin/server:arm64-3.6.1
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - default
      - proxy
    environment:
      - APP_PORT=${APP_PORT}
      - APP_BASE_URL=${APP_BASE_URL}
      - MAX_TIME_DRIFT=${MAX_TIME_DRIFT}
      - MAILER_ENABLED=${MAILER_ENABLED}
      - MAILER_HOST=${MAILER_HOST}
      - MAILER_PORT=${MAILER_PORT}
      - MAILER_SECURE=${MAILER_SECURE}
      - MAILER_AUTH_USER=${MAILER_AUTH_USER}
      - MAILER_AUTH_PASSWORD=${MAILER_AUTH_PASSWORD}
      - MAILER_NOREPLY_NAME=${MAILER_NOREPLY_NAME}
      - MAILER_NOREPLY_EMAIL=${MAILER_NOREPLY_EMAIL}
      - DB_CLIENT=${DB_CLIENT}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - TRANSCRIBE_API_KEY=${TRANSCRIBE_API_KEY}
      - TRANSCRIBE_BASE_URL=http://transcribe:4567
      - TRANSCRIBE_ENABLED=${TRANSCRIBE_ENABLED}
  transcribe:
    image: joplin/transcribe:arm64-3.6.6
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - default
    volumes:
      - transcribe_data_images:/app/packages/transcribe/images
      - transcribe_data_models:/opt/models:ro
    environment:
      - APP_PORT=4567
      - DB_CLIENT=${DB_CLIENT}
      - QUEUE_DATABASE_NAME=${QUEUE_DATABASE_NAME}
      - QUEUE_DATABASE_USER=${QUEUE_DATABASE_USER}
      - QUEUE_DATABASE_PASSWORD=${QUEUE_DATABASE_PASSWORD}
      - QUEUE_DATABASE_PORT=${QUEUE_DATABASE_PORT}
      - QUEUE_DATABASE_HOST=${QUEUE_DATABASE_HOST}
      - API_KEY=${TRANSCRIBE_API_KEY}
      - HTR_CLI_IMAGES_FOLDER=/app/packages/transcribe/images
      - HTR_CLI_MODELS_FOLDER=/opt/models

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $PWD/data/db
  transcribe_data_images:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $PWD/data/transcribe/images
  transcribe_data_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $PWD/data/transcribe/models

networks:
  proxy:
    external: true
    name: nginx_proxy
