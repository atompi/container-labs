---
name: frpc

services:
  frpc:
    image: atompi/frpc:0.59.0
    restart: always
    extra_hosts:
      - "atompi.cc:192.168.0.2"
    volumes:
      - ./logs:/app/logs
      - ./conf/frpc.toml:/app/frpc.toml
      - ./conf/ca.crt:/app/ca.crt
      - ./conf/server.crt:/app/server.crt
      - ./conf/server.key:/app/server.key

networks:
  default:
    external: true
    name: conpeer
