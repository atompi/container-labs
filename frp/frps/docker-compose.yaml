---
name: frps

services:
  frps:
    image: atompi/frps:0.59.0
    restart: always
    ports:
      - "7000:7000"
      - "7001:7001"
    volumes:
      - ./logs:/app/logs
      - ./conf/frps.toml:/app/frps.toml
      - ./conf/ca.crt:/app/ca.crt
      - ./conf/server.crt:/app/server.crt
      - ./conf/server.key:/app/server.key
