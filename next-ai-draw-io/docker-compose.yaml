---
name: aidraw

services:
  aidraw:
    image: ghcr.io/dayuanjiang/next-ai-draw-io:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/app/data

volumes:
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $PWD/data

networks:
  default:
    external: true
    name: compose
